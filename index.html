<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CRIAFÁCIL IA</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#090d22;color:white}
header{padding:32px 18px;text-align:center;background:linear-gradient(135deg,#6825df,#087cf5)}
h1{font-size:32px;margin:0}
header p{opacity:.95}
main{padding:22px;max-width:600px;margin:auto}
h2{font-size:21px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card{background:#171d3b;border:1px solid #39447b;border-radius:16px;padding:22px 12px;text-align:center;cursor:pointer;color:white;font-size:15px}
.card span{display:block;font-size:32px;margin-bottom:12px}
.card:hover{border-color:#a36aff}
.info{margin-top:25px;background:#171d3b;border-radius:15px;padding:20px;text-align:center}
button{border:0;border-radius:12px;padding:13px 22px;background:#7138ed;color:white;font-weight:bold}
footer{text-align:center;padding:24px;color:#aab2d5;font-size:12px}
</style>
</head>
<body>
<header>
<h1>✨ CRIAFÁCIL IA</h1>
<p>Sua criatividade sem limites!</p>
</header>
<main>
<h2>O que vamos criar hoje?</h2>
<div class="grid">
<div class="card" onclick="aviso()"><span>🎨</span>Artes para vendas</div>
<div class="card" onclick="aviso()"><span>📸</span>Fotos com IA</div>
<div class="card" onclick="aviso()"><span>🎬</span>Vídeos realistas</div>
<div class="card" onclick="aviso()"><span>🎵</span>Músicas com IA</div>
<div class="card" onclick="aviso()"><span>🌟</span>Animes</div>
<div class="card" onclick="aviso()"><span>🎓</span>Cursos rápidos</div>
<div class="card" onclick="aviso()"><span>🎉</span>Convites</div>
<div class="card" onclick="aviso()"><span>⚽</span>Figurinhas</div>
</div>
<div class="info">
<h2>🚀 Comece a criar</h2>
<p>Transforme suas ideias em artes incríveis!</p>
<button onclick="aviso()">Começar agora</button>
</div>
</main>
<footer>CRIAFÁCIL IA © 2026</footer>
<script>
function aviso(){alert("Em breve! Estamos construindo esta ferramenta.")}
</script>
</body>
</html>
